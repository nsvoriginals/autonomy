[package]
name = "autonomy-vehicle-ugv"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "UGV vehicle implementation with wheeled/tracked dynamics"

[dependencies]
autonomy-common = { path = "../common" }
autonomy-vehicle = { path = "../vehicle" }
autonomy-physics = { path = "../physics" }
autonomy-sensors = { path = "../sensors" }
autonomy-estimation = { path = "../estimation" }
autonomy-planning = { path = "../planning" }
autonomy-control = { path = "../control" }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
nalgebra = { workspace = true }
glam = { workspace = true }
smallvec = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }